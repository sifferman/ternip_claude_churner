[pytest]
# Use importlib import-mode so test modules don't accidentally promote
# ``architecture_visualizer/lib/`` to the top-level ``lib`` package
# (which would collide with ``ternary_matmul/sw_utils/lib`` that the
# throughput parity tests need to import).
addopts = --import-mode=importlib

markers =
    slow: marks tests that take >1s (subprocess calls, big model loads)
